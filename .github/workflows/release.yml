name: release

on:
  push:
    tags: ['v*.*.*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 发布版本唯一来源 = git tag（去掉 v 前缀）；Directory.Build.props 仅为本地开发默认值。
      - name: Native AOT publish (Release + RID => PublishAot; Version from tag)
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Write-Host "Publishing version=$version (from tag $env:GITHUB_REF_NAME)"
          dotnet publish src/DshDesktop.App -c Release -r win-x64 -p:Version=$version

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # 安装包：默认 D:\Program Files\DSH-Desktop（无 D 盘回退系统盘），用户可在向导中自选目录。
      - name: Inno Setup compile
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$version installer/DshDesktop.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      # 便携包：免安装解压即用（便携形态下自更新整体 no-op，升级需换包）。
      - name: Portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "src/DshDesktop.App/bin/Release/net10.0-windows/win-x64/publish/*" -DestinationPath "releases/DSH-Desktop-win-Portable.zip" -Force

      - name: Upload GitHub Release (Setup exe + portable zip)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME --repo MiKiNuo/DSH-Desktop --title $env:GITHUB_REF_NAME releases/*.exe releases/*.zip

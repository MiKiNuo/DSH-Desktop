name: release

on:
  push:
    tags: ['v*.*.*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 发布版本唯一来源 = git tag（去掉 v 前缀）；Directory.Build.props 仅为本地开发默认值。
      - name: Native AOT publish (Release + RID => PublishAot; Version from tag)
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Write-Host "Publishing version=$version (from tag $env:GITHUB_REF_NAME)"
          dotnet publish src/DshDesktop.App -c Release -r win-x64 -p:Version=$version

      - name: Install vpk
        run: dotnet tool install --global vpk

      - name: Velopack pack
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          vpk pack --packId DSH-Desktop --packVersion $version --packDir src/DshDesktop.App/bin/Release/net10.0-windows/win-x64/publish --outputDir releases --mainExe DshDesktop.App.exe --packTitle "DSH-Desktop"

      - name: Upload GitHub Release (Setup.exe + nupkg + RELEASES index)
        run: vpk upload github --repoUrl https://github.com/MiKiNuo/DSH-Desktop --token ${{ secrets.GITHUB_TOKEN }} --tag ${{ github.ref_name }} --releaseName ${{ github.ref_name }} --publish --outputDir releases

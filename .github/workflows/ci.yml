name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DshDesktop.slnx

      - name: Build (Debug)
        run: dotnet build DshDesktop.slnx -c Debug --no-restore

      - name: Test (TUnit, MTP runner via global.json)
        run: dotnet test tests/DshDesktop.Tests -c Debug --no-build

  aot-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Native AOT publish (Release + RID => PublishAot, §31)
        run: dotnet publish src/DshDesktop.App -c Release -r win-x64 2>&1 | Tee-Object publish.log

      - name: AOT warning gate (§49)
        shell: pwsh
        run: |
          $codes = Select-String -Path publish.log -Pattern 'warning IL\d{4}' -AllMatches |
            ForEach-Object { [regex]::Match($_.Line, 'warning (IL\d{4})').Groups[1].Value } |
            Sort-Object -Unique
          $baseline = [int](Get-Content aot-warning-baseline.txt |
            Where-Object { $_ -notmatch '^\s*#' -and $_.Trim().Length -gt 0 } |
            Select-Object -First 1)
          Write-Host "AOT warning codes: $($codes -join ', ') (distinct=$($codes.Count), baseline=$baseline)"
          if ($codes.Count -gt $baseline) {
            throw "AOT 警告超基线：$($codes.Count) > $baseline（新依赖破坏 AOT 兼容性，见 §49）"
          }
